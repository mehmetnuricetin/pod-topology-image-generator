apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-topology
  labels:
    app: nginx-topology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-topology
  template:
    metadata:
      labels:
        app: nginx-topology
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-topology
spec:
  selector:
    app: nginx-topology
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-topology
spec:
  ingressClassName: nginx
  rules:
  - host: nginx.localtest.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-topology
            port:
              number: 80
